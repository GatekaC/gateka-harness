# Variant « kimi » — Moonshot's Kimi K3.1 Pro, the best-scored model Nebius
# publishes (Artificial Analysis index 46.5 on 2026-11-13; $2 / $10 per
# million), to measure against the default on real treatments. Until that
# day this ran Kimi K2.7 Code, which Nebius withdrew (owner: « K3.1 Pro »).
# Picked with: /go <texte> @gateka:kimi
- id: llm-pi-ai
  config:
    providers:
      nebius:
        displayName: Nebius AI Studio
        apiKeyEnv: NEBIUS_API_KEY
        api: openai-completions
        baseURL: https://api.studio.nebius.com/v1
        models:
          - id: moonshotai/Kimi-K3.1-Pro
            input: [text, image]
          - id: deepseek-ai/DeepSeek-V4.1-Flash-1017
            input: [text, image]

- id: agent-default-model
  config:
    provider: nebius
    model: moonshotai/Kimi-K3.1-Pro
