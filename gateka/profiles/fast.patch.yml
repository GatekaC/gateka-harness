# Variant « fast » — the default: DeepSeek V4.1 Flash on Nebius.
# The variants are named after the tiers of the other Gateka-run proxies
# (MaQI, BulkHours: fast, code, reasoning) and run the same models (owner,
# 2026-11-13: « gateka convention should follow the rest for now »).
# Picked when nothing else is named; /go <texte> @gateka:fast names it.
- id: llm-pi-ai
  config:
    providers:
      nebius:
        displayName: Nebius AI Studio
        apiKeyEnv: NEBIUS_API_KEY
        api: openai-completions
        baseURL: https://api.studio.nebius.com/v1
        models:
          - id: deepseek-ai/DeepSeek-V4.1-Flash-1017
            input: [text, image]
          - id: zai-org/GLM-5.3
          - id: zai-org/GLM-5.2
          - id: Qwen/Qwen3-30B-A3B-Instruct-2507

- id: agent-default-model
  config:
    provider: nebius
    model: deepseek-ai/DeepSeek-V4.1-Flash-1017
